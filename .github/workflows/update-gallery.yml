name: Update video gallery
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: video-gallery
  cancel-in-progress: false
jobs:
  gallery:
    # Never execute code from an untrusted PR, or write to its branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check gallery is installed on main
        id: installed
        shell: bash
        run: |
          if [[ -f scripts/update_gallery.sh && -f scripts/update_gallery.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gallery scripts are not on main yet. Merge the gallery setup PR first; refresh will run on the resulting main push."
          fi
      - name: Install ffmpeg
        if: steps.installed.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Collect videos from immutable branch snapshots
        if: steps.installed.outputs.ready == 'true'
        run: bash scripts/update_gallery.sh
      - name: Open gallery-only update PR
        if: steps.installed.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: gallery/automated-update
          base: main
          add-paths: |
            docs/index.html
            docs/gallery.json
            docs/.nojekyll
            docs/videos/
            docs/reports/
          commit-message: 'chore: refresh video gallery'
          title: '영상 갤러리 자동 갱신'
          body: 'main 및 codex/* 브랜치의 영상을 수집했습니다. 원본 영상과 제작 브랜치는 수정하지 않습니다.'
