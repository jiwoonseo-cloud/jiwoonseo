name: Update video gallery
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: video-gallery
  cancel-in-progress: false
jobs:
  gallery:
    # Never execute code from an untrusted PR, or write to its branch.
    if: (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/gallery/')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check gallery is installed on main
        id: installed
        shell: bash
        run: |
          if [[ -f scripts/update_gallery.sh && -f scripts/update_gallery.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gallery scripts are not on main yet. Merge the gallery setup PR first; refresh will run on the resulting main push."
          fi
      - name: Ensure ffmpeg is available
        if: steps.installed.outputs.ready == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Collect videos from immutable branch snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.installed.outputs.ready == 'true'
        run: bash scripts/update_gallery.sh
      - name: Open gallery-only update PR
        if: steps.installed.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: gallery/automated-update
          base: main
          add-paths: docs/
          commit-message: 'chore: refresh video gallery'
          title: '영상 갤러리 자동 갱신'
          body: 'main 및 codex/* 브랜치의 영상을 수집했습니다. 원본 영상과 제작 브랜치는 수정하지 않습니다.'
