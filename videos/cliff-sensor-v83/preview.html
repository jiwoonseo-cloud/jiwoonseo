<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>클리프 센서 v8.3 비교</title><style>body{margin:0;background:#101923;color:#eef3f5;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}video{display:none;max-height:78vh;max-width:100%;margin:16px auto;background:black}video.active{display:block}button{padding:12px 20px;margin:6px;border:1px solid #698187;border-radius:8px;background:#20333d;color:white;cursor:pointer}button.selected{background:#bd383c}p{color:#bed0d7}</style><main><h1>클리프 센서 v8.3</h1><p>같은 내레이션 · 같은 타임라인 · 화면 스타일 비교</p><button class="selected" onclick="pick('pixel',this)">픽셀아트</button><button onclick="pick('illustration',this)">2D 일러스트</button><video id="pixel" class="active" controls playsinline preload="metadata" src="cliff-sensor-v83-pixel.mp4"></video><video id="illustration" controls playsinline preload="metadata" src="cliff-sensor-v83-illustration.mp4"></video><p>같은 폴더에 두 MP4와 이 HTML을 두고 브라우저로 열어 주세요. 버튼을 누르면 같은 시점으로 전환됩니다.</p></main><script>let active=document.getElementById('pixel');function pick(id,button){const next=document.getElementById(id);if(next===active)return;const t=active.currentTime,wasPlaying=!active.paused;active.pause();active.classList.remove('active');next.currentTime=t;next.classList.add('active');document.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');active=next;if(wasPlaying)next.play().catch(()=>{});}</script></html>
